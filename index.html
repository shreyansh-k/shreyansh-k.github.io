<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Drive</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Mono:wght@400;500&display=swap');
        :root { --ink: #f2f6f2; --muted: #9aaba3; --line: rgba(230, 245, 236, .18); --panel: rgba(8, 18, 19, .76); --accent: #ffd166; --green: #7ee2aa; --danger: #ff6961; }
        * { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background: #152526; color: var(--ink); font-family: 'DM Mono', monospace; }
        #viewport, canvas { position: fixed; inset: 0; display: block; }
        .hud { position: fixed; inset: 0; padding: 22px; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        .topbar, .bottom { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
        .brand, .readout, .help, .button { border: 1px solid var(--line); background: var(--panel); backdrop-filter: blur(12px); }
        .brand { padding: 13px 16px 12px; border-left: 3px solid var(--accent); }
        .brand strong { display: block; font: 800 28px/1 'Barlow Condensed', sans-serif; letter-spacing: .08em; }
        .brand span { display: block; margin-top: 5px; color: var(--muted); font-size: 10px; letter-spacing: .12em; }
        .readouts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
        .readout { min-width: 92px; padding: 9px 12px; }
        .readout label { display: block; color: var(--muted); font-size: 9px; letter-spacing: .1em; }
        .readout b { display: block; margin-top: 4px; color: var(--accent); font-size: 17px; font-weight: 500; }
        .help { padding: 12px 14px; color: var(--muted); font-size: 10px; line-height: 1.8; }
        .help b { color: var(--ink); font-weight: 500; }
        #message { color: var(--green); }
        .button { color: var(--ink); cursor: pointer; pointer-events: auto; padding: 10px 12px; font: 500 10px 'DM Mono', monospace; }
        .button:hover { border-color: var(--accent); color: var(--accent); }
        #damage { color: var(--green); }
        #crashOverlay { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; opacity: 0; background: rgba(140, 20, 20, .3); color: var(--danger); font: 800 52px 'Barlow Condensed', sans-serif; letter-spacing: .12em; text-align: center; text-shadow: 0 3px 14px #000; transition: opacity .25s; }
        #loading { position: fixed; inset: 0; z-index: 3; display: grid; place-items: center; background: #152526; font: 700 20px 'Barlow Condensed', sans-serif; letter-spacing: .15em; transition: opacity .5s; }
        @media (max-width: 700px) { .hud { padding: 12px; } .topbar { flex-wrap: wrap; } .readouts { width: 100%; justify-content: flex-start; } .readout { flex: 1; min-width: 74px; } .help { font-size: 9px; } }
    </style>
</head>
<body>
    <div id="viewport"></div>
    <div id="loading">LOADING CITY DRIVE</div>
    <div id="crashOverlay">CAR DAMAGED<br><small>PRESS R TO RESET</small></div>
    <div class="hud">
        <div class="topbar">
            <div class="brand"><strong>CITY DRIVE</strong><span>OPEN ROAD / NIGHT RUN</span></div>
            <div class="readouts">
                <div class="readout"><label>SPEED</label><b><span id="speed">0</span> KM/H</b></div>
                <div class="readout"><label>GEAR</label><b id="gear">N</b></div>
                <div class="readout"><label>DRIVE</label><b id="drive">CRUISE</b></div>
                <div class="readout"><label>DAMAGE</label><b id="damage">0%</b></div>
                <button class="button" id="cameraBtn">CAMERA [C]</button>
            </div>
        </div>
        <div class="bottom">
            <div class="help"><b>WASD / ARROWS</b> drive & steer &nbsp; <b>SPACE</b> handbrake<br><b>SHIFT</b> boost &nbsp; <b>C</b> camera &nbsp; <b>R</b> reset<br><span id="message">LOADING CITY DRIVE ASSETS</span></div>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>
    <script type="module">
       import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7e9996);
        scene.fog = new THREE.Fog(0x7e9996, 180, 1200);
        const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, .1, 2500);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.setSize(innerWidth, innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.querySelector('#viewport').appendChild(renderer.domElement);

        scene.add(new THREE.HemisphereLight(0xdce9e1, 0x243936, 2.3));
        const sun = new THREE.DirectionalLight(0xffe4bd, 3);
        sun.position.set(-100, 180, 80);
        sun.castShadow = true;
        sun.shadow.mapSize.set(2048, 2048);
        scene.add(sun);

        const loader = new GLTFLoader();
        loader.setMeshoptDecoder(MeshoptDecoder);
        const city = new THREE.Group();
        scene.add(city);
        const car = new THREE.Group();
        scene.add(car);
        const colliders = [];
        const groundRay = new THREE.Raycaster();
        const down = new THREE.Vector3(0, -1, 0);
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(2400, 2400),
            new THREE.MeshStandardMaterial({ color: 0x364b46, roughness: 1 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const start = new THREE.Vector3(0, .65, 18);
        let carModel;
        let cameraMode = 0;
        let cityLoaded = false;
        let carLoaded = false;
        const keys = new Set();
        const input = { throttle: 0, steer: 0 };
        const state = { speed: 0, heading: 0, steer: 0, damage: 0, crashed: false, boost: 0 };
        const clock = new THREE.Clock();
        const carBox = new THREE.Box3();
        const obstacleBox = new THREE.Box3();
        const temp = new THREE.Vector3();

        function setShadows(root) {
            root.traverse(object => {
                if (object.isMesh) {
                    object.castShadow = true;
                    object.receiveShadow = true;
                }
            });
        }

        function fitCar(root) {
            const box = new THREE.Box3().setFromObject(root);
            const size = box.getSize(new THREE.Vector3());
            const length = Math.max(size.x, size.y, size.z);
            if (length > 0) root.scale.setScalar(4.6 / length);
            root.position.y = 0;
            root.rotation.y = Math.PI;
        }

        function createFallbackCar() {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(2.1, .62, 4.2), new THREE.MeshStandardMaterial({ color: 0xd33d32, metalness: .45, roughness: .28 }));
            body.position.y = .72;
            group.add(body);
            const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.55, .58, 1.7), new THREE.MeshStandardMaterial({ color: 0x172a32, metalness: .2, roughness: .2 }));
            cabin.position.set(0, 1.18, -.15);
            group.add(cabin);
            for (const x of [-1.08, 1.08]) for (const z of [-1.38, 1.38]) {
                const wheel = new THREE.Mesh(new THREE.CylinderGeometry(.38, .38, .24, 16), new THREE.MeshStandardMaterial({ color: 0x101415, roughness: .75 }));
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(x, .42, z);
                group.add(wheel);
            }
            setShadows(group);
            return group;
        }


        const cityUrl = 'https://raw.githubusercontent.com/shreyansh-k/taxigame/main/city.glb';
        const carUrl = 'https://raw.githubusercontent.com/shreyansh-k/taxigame/main/car.glb';

     const CITY_SCALE = 5; // raise or lower this if the city is too small or too big

                loader.load(cityUrl, gltf => {
            const model = gltf.scene;
            model.scale.setScalar(CITY_SCALE);

            // 1. Calculate the exact physical bounding box of the city model
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            
            // 2. Center the geometry on the X and Z plane, and snap its base floor to Y = 0
            // This mirrors the fallback road's properties perfectly at the origin.
            model.position.set(-center.x, -box.min.y, -center.z);
            model.rotation.set(0, 0, 0);

            city.add(model);
            setShadows(model);
            model.traverse(object => { if (object.isMesh) colliders.push(object); });
            cityLoaded = true;
            document.querySelector('#message').textContent = 'CITY READY - FIND YOUR LINE';
        }, xhr => {
            if (xhr.total) console.log(`city.glb ${Math.round(xhr.loaded / xhr.total * 100)}%`);
        }, err => {
            console.error('city.glb failed:', err);
            document.querySelector('#message').textContent = 'CITY.GLB FAILED - SEE CONSOLE';
        });


        loader.load(carUrl, gltf => {
            carModel = gltf.scene;
            fitCar(carModel);
            setShadows(carModel);
            car.add(carModel);
            carLoaded = true;
        }, undefined, () => {
            carModel = createFallbackCar();
            car.add(carModel);
        });

        function reset() {
            car.position.copy(start);
            car.rotation.set(0, 0, 0);
            Object.assign(state, { speed: 0, heading: 0, steer: 0, damage: 0, crashed: false, boost: 0 });
            document.querySelector('#crashOverlay').style.opacity = '0';
            document.querySelector('#message').textContent = cityLoaded ? 'CITY READY - FIND YOUR LINE' : 'FALLBACK ROAD ACTIVE';
            document.querySelector('#message').style.color = '';
        }

        function toggleCamera() {
            cameraMode = (cameraMode + 1) % 2;
            document.querySelector('#cameraBtn').textContent = cameraMode ? 'CAMERA: HOOD [C]' : 'CAMERA: CHASE [C]';
        }

        addEventListener('keydown', event => {
            keys.add(event.code);
            if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.code)) event.preventDefault();
            if (!event.repeat && event.code === 'KeyR') reset();
            if (!event.repeat && event.code === 'KeyC') toggleCamera();
        });
        addEventListener('keyup', event => keys.delete(event.code));
        document.querySelector('#cameraBtn').addEventListener('click', toggleCamera);

        function updateInput(dt) {
            const throttle = (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0) - (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0);
            const steer = (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0);
            input.throttle = THREE.MathUtils.damp(input.throttle, throttle, throttle ? 7 : 4, dt);
            input.steer = THREE.MathUtils.damp(input.steer, steer, 9, dt);
        }

        function getGroundY() {
            groundRay.set(new THREE.Vector3(car.position.x, car.position.y + 30, car.position.z), down);
            const hits = groundRay.intersectObjects([ground, ...city.children], true);
            return hits.length ? hits[0].point.y : 0;
        }

        function damageCheck() {
            if (state.crashed || state.speed < 18 || !colliders.length) return;
            carBox.setFromObject(car).expandByScalar(-.35);
            for (const mesh of colliders) {
                obstacleBox.setFromObject(mesh);
                if (carBox.intersectsBox(obstacleBox)) {
                    state.damage = Math.min(100, state.damage + .7);
                    state.speed *= .55;
                    if (state.damage >= 100) {
                        state.crashed = true;
                        document.querySelector('#crashOverlay').style.opacity = '1';
                    }
                    break;
                }
            }
        }

        function updateCar(dt) {
            updateInput(dt);
            if (state.crashed) return;
            const handbrake = keys.has('Space');
            const boosting = keys.has('ShiftLeft') || keys.has('ShiftRight');
            const maxSpeed = boosting ? 54 : 38;
            const acceleration = input.throttle >= 0 ? 25 : 34;
            const targetSpeed = input.throttle * maxSpeed;
            state.speed = THREE.MathUtils.damp(state.speed, targetSpeed, input.throttle ? acceleration / 3 : 1.8, dt);
            if (handbrake) state.speed = THREE.MathUtils.damp(state.speed, 0, 7, dt);
            state.boost = THREE.MathUtils.damp(state.boost, boosting ? 1 : 0, 8, dt);
            const speedFactor = THREE.MathUtils.clamp(Math.abs(state.speed) / 18, 0, 1);
            const steeringPower = (handbrake ? 1.45 : 1) * (state.speed < 0 ? -1 : 1);
            state.steer = THREE.MathUtils.damp(state.steer, input.steer, 9, dt);
            state.heading += state.steer * steeringPower * speedFactor * dt * 1.85;
            const distance = state.speed * dt;
            car.position.x += Math.sin(state.heading) * distance;
            car.position.z += Math.cos(state.heading) * distance;
            const floorY = getGroundY();
            car.position.y = THREE.MathUtils.damp(car.position.y, floorY, 18, dt);
            car.rotation.y = state.heading;
            car.rotation.z = THREE.MathUtils.damp(car.rotation.z, -state.steer * speedFactor * .12, 8, dt);
            damageCheck();
        }

        function updateHud() {
            const kmh = Math.round(Math.abs(state.speed) * 3.6);
            document.querySelector('#speed').textContent = kmh;
            document.querySelector('#gear').textContent = state.speed > .4 ? 'D' : state.speed < -.4 ? 'R' : 'N';
            document.querySelector('#drive').textContent = state.crashed ? 'WRECKED' : state.boost > .2 ? 'BOOST' : keys.has('Space') ? 'BRAKING' : 'CRUISE';
            document.querySelector('#damage').textContent = `${Math.round(state.damage)}%`;
            document.querySelector('#damage').style.color = state.damage > 70 ? '#ff6961' : '#7ee2aa';
        }

        // REPLACE your existing updateCamera function with this single copy:
        function updateCamera(dt) {
            const offset = cameraMode ? new THREE.Vector3(0, 1.75, 2.5) : new THREE.Vector3(0, 4.6, 10.5);
            offset.applyAxisAngle(new THREE.Vector3(0, 1, 0), state.heading);
            const desired = car.position.clone().add(offset);
            camera.position.lerp(desired, 1 - Math.pow(.001, dt));
            temp.copy(car.position);
            temp.y += cameraMode ? 1.15 : 1.25;
            camera.lookAt(temp);
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), .05);
            updateCar(dt);
            updateHud();
            updateCamera(dt);
            renderer.render(scene, camera);
        }

        addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });

        reset();
        camera.position.set(0, 5, -10);
        animate();
        setTimeout(() => {
            document.querySelector('#loading').style.opacity = '0';
            setTimeout(() => document.querySelector('#loading').remove(), 600);
        }, 900);
    </script>
</body>
</html>
